name: Workflow to Deploy Timetable Bot to Azure App Service

permissions:
  contents: read

concurrency:
  group: timetable-bot-deployment
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run Unit Tests
        run: |
          pytest --maxfail=1

  package:
    needs: test
    name: Build Application and Create Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Packaging Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools

      - name: Export Committed Source
        run: |
          mkdir deployment
          git archive HEAD | tar -x -C deployment

      - name: Generate requirements.txt from pyproject.toml
        working-directory: deployment
        run: |
          pip-compile pyproject.toml --output-file requirements.txt --resolver=backtracking

      - name: Create Zip Deployment Package
        working-directory: deployment
        run: |
          zip -r ../app.zip . -x '.github/*' 'tests/*'

      - uses: actions/upload-artifact@v4
        with:
          name: bot-${{ github.sha }}
          path: app.zip
          if-no-files-found: error
          retention-days: 14

  staging:
    needs: package
    name: Deploy to Staging Azure Web App
    environment: staging
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: bot-${{ github.sha }}
          path: package

      - name: Deploy Staging Code Package to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: package/app.zip

  deploy:
    needs: staging
    name: Deploy to Azure Web App
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: bot-${{ github.sha }}
          path: package
          
      - name: Deploy Production Code Package to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: package/app.zip
