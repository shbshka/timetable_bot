start:
  welcome_back: |
    👋 Welcome back, <b>{first_name}</b>!

    📌 <b>Current group:</b> <code>{group_name}</code>

    Quick commands:
    • /today — Today's schedule
    • /week — Schedule for the week
    • /group — Change group
    • /language — Change language
    • /help — Help & settings

  welcome_new: |
    👋 Hi, <b>{first_name}</b>!

    This is <b>Raspisaniye Bot</b>.
    The bot will display your current schedule and notify you about changes in Google Sheets.
    Vibe-coded by <b>@shoobec</b> because I was fed up with loading Google Sheets every single time.

    Select your study group:

help: |
  No one here can help you except yourself 🗿
  (you can ping me at @shoobec)
  Quick commands:
  • /today — Today's schedule
  • /week — Schedule for the week
  • /group — Change group
  • /language — Change language
  • /help — Help & settings

btns:
  btn_today: "📅 Today"
  btn_tomorrow: "➡️ Tomorrow"
  btn_week: "📅 Full week"
  btn_current_week: "📅 Current week"
  btn_change_group: "⚙️ Change group"
  btn_select_group: "🎓 Select group"
  btn_language: "🌐 Язык / Language"
  btn_home: "🏠 Main menu"

language:
  prompt: "Select interface language:"
  changed: "Interface language: {language}."

group:
  choose_form:
    step_1: "Step 1/3: Select form of study:"
    step_2: |
      Form: <b>{selected_form}</b>

      Step 2/3: Select study year:
    step_3: |
      Form: <b>{selected_form}</b>
      Year: <b>{selected_year}</b>

      Step 3/3: Select major [currently under development]:

  errors:
    not_chosen: "⚠️ First select a group via /group"
    not_found: |
      ❌ <b>Group not found</b>

      No group found for <b>{study_form}</b> ({year_num} year, enrollment year {enrollment_year}).
      Please contact @shoobec, as something probably went down again.
  success: |
    ✅ <b>Group successfully selected!</b>

    • <b>Form of study:</b> {study_form}
    • <b>Year:</b> Year {year_num} ({enrollment_year})
    • <b>Group code:</b> <code>{group_name}</code>

    Send /today or /week to view the schedule.

schedule:
  weekdays:
    monday: "monday"
    tuesday: "tuesday"
    wednesday: "wednesday"
    thursday: "thursday"
    friday: "friday"
    saturday: "saturday"
    sunday: "sunday"
  months:
    january: "January"
    february: "February"
    march: "March"
    april: "April"
    may: "May"
    june: "June"
    july: "July"
    august: "August"
    september: "September"
    october: "October"
    november: "November"
    december: "December"
  time_tbd: "Time TBD"
  daily: |
    📅 <b>Schedule for {group_name}</b>
    📆 <i>{date_str}</i>

  weekly: |
    📅 <b>Weekly schedule for {group_name}</b>
    ─────────────────────────
    {week_schedule}

  empty: |
    No classes 🌚

  updated: |
    🔔 <b>Schedule updated for {group_name}</b>
    📅 <i>{date_str}</i>
    
    /today — view today's schedule

  submit_link:
    success: |
      ✅ Thank you! The schedule link for <b>{group_name}</b> was successfully sent to the admin.
    accepted: |
      ✅ The schedule link for <b>{group_name}</b> was approved by the admin.
    rejected: |
      ❌ The schedule link for <b>{group_name}</b> was rejected by the admin.
    invalid: |
      ❌ The schedule link for <b>{group_name}</b> was rejected by the bot due to an invalid link or empty timetable.

  errors:
    notification_failed: |
      ⚠️ Failed to send notification to the admin. Please text @shoobec manually.
    not_found: |
      ❌ No schedule found in the database for <b>{group_name}</b>.
      Got a link to it? Send it as a reply and wait a bit
      (it takes a while, I confirm them manually).

error:
  schedule_fetch_failed: |
    Oh, come on
    ❌ Failed to load the schedule.
    For goodness' sake, stop clicking the buttons, I already received a notification and I'm looking into it.
  session_expired: |
    ⚠️ Session expired. Send the last command again and restart.

admin:
  unauthorized:
    callback: "❌ Uh-oh, you're not allowed here"
    command: "⛔ Uh-oh, you aren't allowed to do this"
  help: |
    <b>Admin commands</b>
    /attach &lt;group&gt; &lt;link_or_ID&gt; — attach schedule
    /detach &lt;group&gt; — remove schedule link
    /users &lt;year_1-5&gt; &lt;form_HR_HRO_LR&gt; — group users
    /ban &lt;chat_id&gt; — block access to bot
    /unban &lt;chat_id&gt; — restore access
  usage:
    users: "Usage: <code>/users &lt;year 1-5&gt; &lt;HR|HRO|LR&gt;</code>"
    attach: "⚠ Usage: <code>/attach &lt;group&gt; &lt;link_or_ID&gt;</code>"
    detach: "⚠️ Usage: <code>/detach &lt;group&gt;</code>"
    ban: "Usage: <code>/ban &lt;chat_id&gt;</code> or <code>/unban &lt;chat_id&gt;</code>"
  user: ""

  users_usage: "Usage: <code>/users &lt;year 1-5&gt; &lt;HR|HRO|LR&gt;</code>"
  group_not_found: "Group for year {course_year}, study form {study_form}, and enrollment year {enrollment_year} was not found."
  users_empty: "There are no registered users in group <b>{group_name}</b> yet."
  users_header: "<b>{group_name}</b> — users: {count}"
  banned_status: " — <b>banned</b>"
  ban_usage: "Usage: <code>/ban &lt;chat_id&gt;</code> or <code>/unban &lt;chat_id&gt;</code>"
  user_banned: "Access for <code>{chat_id}</code> has been blocked."
  user_already_banned: "User <code>{chat_id}</code> is already blocked."
  user_unbanned: "Access for <code>{chat_id}</code> has been restored."
  user_not_banned: "User <code>{chat_id}</code> is not blocked or not found."
  banned_access: "⛔ Access to the bot is blocked."
  sheet:
    attached: |
      ✅ <b>Schedule updated</b>
      • <b>Group:</b> <code>{group_name}</code>
      • <b>Sheet ID:</b> <code>{sheet_id}</code>
      • <b>Cache:</b> updated
      Old group links removed.
    approved: |
      ✅ <b>Link approved and attached</b>
      • <b>Sheet ID:</b> <code>{sheet_id}</code>
      • <b>Cache:</b> updated
    rejected: |
      ❌ <b>Link rejected</b>
      • <b>Sheet ID:</b> <code>{sheet_id}</code>
    invalid: "❌ Invalid Google Sheets link or ID."
    detached: "🗑️ Schedule link removed for group <code>{group_name}</code>."
    not_attached: "ℹ️ No link was attached for group <code>{group_name}</code>."
    errors:
      group_not_found: "❌ Group <code>{group_name}</code> not found."
      submission_not_found: "❌ Link attachment request not found."
  forwards:
    link:
      new_submission: |
        📌 <b>New schedule link</b>

        • Sender: {user_name} (@{user_username}, ID: {user_chat_id})
        • Group: {group_name}
        • Sheet ID: {sheet_id}
        • Link: {link_text}
      approve_button: ✅ Attach link to group {group_name}
      reject_button: ❌ Reject link for group {group_name}
      approve_sheet: |
        ✅ <b>Schedule link approved!</b>

        • Group: {group_name}
        • Sheet ID: {sheet_id}
    error:
      error_occurred: |
        ⚠️⚠️⚠️ An error occurred: {error_message}