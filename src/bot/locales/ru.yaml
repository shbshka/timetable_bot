error:
  schedule_fetch_failed: |
    Да емае
    ❌ Не удалось загрузить расписание.
    Ради бога, не тыкайте кнопки, мне уже пришло уведомление, я буду разбираться.
  session_expired: |
    ⚠️ Сессия истекла. Отправьте последнюю команду и начните заново.

admin:
  unauthorized:
    callback: "❌ Ай-яй, сюда низя"
    command: "⛔ Ай-яй, тебе это делать низя"
  help: |
    *Команды администратора*
    /attach <группа> <ссылка_или_ID> — прикрепить расписание
    /detach <группа> — удалить ссылку расписания
    /users <курс_1-5> <форма_HR_HRO_LR> — пользователи группы
    /ban <chat_id> — запретить доступ к боту
    /unban <chat_id> — восстановить доступ
  usage:
    users: "Использование: `/users <курс 1-5> <HR|HRO|LR>`"
    attach: "⚠️️ Использование: `/attach <группа> <ссылка_или_ID>`"
    detach: "⚠️ Использование: `/detach <группа>`"
    ban: "Использование: `/ban <chat_id>` или `/unban <chat_id>`"
  user: ""

  users_usage: "Использование: `/users <курс 1-5> <HR|HRO|LR>`"
  group_not_found: "Группа для курса {course_year}, формы {study_form} и года поступления {enrollment_year} не найдена."
  users_empty: "В группе *{group_name}* пока нет зарегистрированных пользователей."
  users_header: "*{group_name}* — пользователей: {count}"
  banned_status: " — *заблокирован*"
  ban_usage: "Использование: `/ban <chat_id>` или `/unban <chat_id>`"
  user_banned: "Доступ для `{chat_id}` заблокирован."
  user_already_banned: "Пользователь `{chat_id}` уже заблокирован."
  user_unbanned: "Доступ для `{chat_id}` восстановлен."
  user_not_banned: "Пользователь `{chat_id}` не заблокирован или не найден."
  banned_access: "⛔ Доступ к боту запрещён."
  sheet:
