  btn_home: "🏠 Главное меню"

language:
  prompt: "Выберите язык интерфейса:"
  changed: "Язык интерфейса: {language}."

group:
  choose_form:
    step_1: "Шаг 1/2: Выбери форму обучения:"
    step_2: |
      Форма: *{selected_form}*

      Шаг 2/2: Выбери курс:
  errors:
    not_chosen: "⚠️ Сначала выбери группу через /group"
    not_found: |
      ❌ *Группа не найдена*

      Не найдена группа для *{study_form}* ({year_num} курс, год поступления {enrollment_year}).
      Пожалуйста, свяжитесь с @shoobec, а то че-то опять прилегло, наверное.
  success: |
    ✅ *Группа успешно выбрана!*

    • *Форма обучения:* {study_form}
    • *Курс:* {year_num} курс ({enrollment_year})
    • *Код группы:* `{group_name}`

    Отправь /today или /week для просмотра расписания.

