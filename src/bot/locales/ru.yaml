start:
  welcome_back: |
    👋 С возвращением, <b>{first_name}</b>!

    📌 <b>Текущая группа:</b> <code>{group_name}</code>

    Быстрые команды:
    • /today — Расписание на сегодня
    • /week — Расписание на неделю
    • /group — Изменить группу
    • /language — Изменить язык
    • /help — Помощь и настройки

  welcome_new: |
    👋 Привет, <b>{first_name}</b>!

    Это <b>Raspisaniye Bot</b>.
    Бот будет отображать текущее расписание и уведомлять об изменениях в Google Sheets.
    Навайбкодила я <b>@shoobec</b> потому что я манала каждый раз гугл щит грузить

    Выбери свою учебную группу:

help: |
  Никто тебе здесь не поможет, кроме тебя самого 🗿
  (можно пнуть меня по @shoobec)
  Быстрые команды:
  • /today — Расписание на сегодня
  • /week — Расписание на неделю
  • /group — Изменить группу
  • /language — Изменить язык
  • /help — Помощь и настройки

btns:
  btn_today: "📅 Сегодня"
  btn_tomorrow: "➡️ Завтра"
  btn_week: "📅 Вся неделя"
  btn_current_week: "📅 Текущая неделя"
  btn_change_group: "⚙️ Сменить группу"
  btn_select_group: "🎓 Выбрать группу"
  btn_language: "🌐 Язык / Language"
  btn_home: "🏠 Главное меню"

language:
  prompt: "Выберите язык интерфейса:"
  changed: "Язык интерфейса: {language}."

group:
  choose_form:
    step_1: "Шаг 1/3: Выбери форму обучения:"
    step_2: |
      Форма: <b>{selected_form}</b>

      Шаг 2/3: Выбери курс:
    step_3: |
      Форма: <b>{selected_form}</b>
      Курс: <b>{selected_year}</b>

      Шаг 3/3: Выбери специальность [в разработке]:

  errors:
    not_chosen: "⚠️ Сначала выбери группу через /group"
    not_found: |
      ❌ <b>Группа не найдена</b>

      Не найдена группа для <b>{study_form}</b> ({year_num} курс, год поступления {enrollment_year}).
      Пожалуйста, свяжитесь с @shoobec, а то че-то опять прилегло, наверное.
  success: |
    ✅ <b>Группа успешно выбрана!</b>

    • <b>Форма обучения:</b> {study_form}
    • <b>Курс:</b> {year_num} курс ({enrollment_year})
    • <b>Код группы:</b> <code>{group_name}</code>

    Отправь /today или /week для просмотра расписания.

schedule:
  weekdays:
    monday: "понедельник"
    tuesday: "вторник"
    wednesday: "среда"
    thursday: "четверг"
    friday: "пятница"
    saturday: "суббота"
    sunday: "воскресенье"
  months:
    january: "января"
    february: "февраля"
    march: "марта"
    april: "апреля"
    may: "мая"
    june: "июня"
    july: "июля"
    august: "августа"
    september: "сентября"
    october: "октября"
    november: "ноября"
    december: "декабря"
  time_tbd: "Время уточняется"
  daily: |
    📅 <b>Расписание для {group_name}</b>
    📆 <i>{date_str}</i>

  weekly: |
    📅 <b>Расписание на неделю для {group_name}</b>
    ─────────────────────────
    {week_schedule}

  empty: |
    Пар нет 🌚

  updated: |
    🔔 <b>Расписание обновлено для {group_name}</b>
    📅 <i>{date_str}</i>
    
    /today — посмотреть расписание на сегодня

  submit_link:
    success: |
      ✅ Спасибо! Ссылка на расписание для <b>{group_name}</b> успешно отправлена админке.
    accepted: |
      ✅ Ссылка на расписание для <b>{group_name}</b> одобрена админкой.
    rejected: |
      ❌ Ссылка на расписание для <b>{group_name}</b> отклонена админкой.
    invalid: |
      ❌ Ссылка на расписание для <b>{group_name}</b> отклонена ботом: некорректная ссылка/пустое расписание.

  errors:
    notification_failed: |
      ⚠️ Не удалось отправить уведомление админке. Напишите ручками @shoobec
    not_found: |
      ❌ В базе не найдено расписание для <b>{group_name}</b>.
      Есть ссылка на него? Отправьте ее ответным сообщением и подождите
      (долго, я руками подтверждаю).

error:
  schedule_fetch_failed: |
    Да емае
    ❌ Не удалось загрузить расписание.
    Ради бога, не тыкайте кнопки, мне уже пришло уведомление, я буду разбираться.
  session_expired: |
    ⚠️ Сессия истекла. Отправьте последнюю команду и начните заново.

admin:
  unauthorized:
    callback: "❌ Ай-яй, сюда низя"
    command: "⛔ Ай-яй, тебе это делать низя"
  help: |
    <b>Команды администратора</b>
    /attach &lt;группа&gt; &lt;ссылка_или_ID&gt; — прикрепить расписание
    /detach &lt;группа&gt; — удалить ссылку расписания
    /users &lt;курс_1-5&gt; &lt;форма_HR_HRO_LR&gt; — пользователи группы
    /ban &lt;chat_id&gt; — запретить доступ к боту
    /unban &lt;chat_id&gt; — восстановить доступ
  usage:
    users: "Использование: <code>/users &lt;курс 1-5&gt; &lt;HR|HRO|LR&gt;</code>"
    attach: "⚠️️ Использование: <code>/attach &lt;группа&gt; &lt;ссылка_или_ID&gt;</code>"
    detach: "⚠️ Использование: <code>/detach &lt;группа&gt;</code>"
    ban: "Использование: <code>/ban &lt;chat_id&gt;</code> или <code>/unban &lt;chat_id&gt;</code>"
  user: ""

  users_usage: "Использование: <code>/users &lt;курс 1-5&gt; &lt;HR|HRO|LR&gt;</code>"
  group_not_found: "Группа для курса {course_year}, формы {study_form} и года поступления {enrollment_year} не найдена."
  users_empty: "В группе <b>{group_name}</b> пока нет зарегистрированных пользователей."
  users_header: "<b>{group_name}</b> — пользователей: {count}"
  banned_status: " — <b>заблокирован</b>"
  ban_usage: "Использование: <code>/ban &lt;chat_id&gt;</code> или <code>/unban &lt;chat_id&gt;</code>"
  user_banned: "Доступ для <code>{chat_id}</code> заблокирован."
  user_already_banned: "Пользователь <code>{chat_id}</code> уже заблокирован."
  user_unbanned: "Доступ для <code>{chat_id}</code> восстановлен."
  user_not_banned: "Пользователь <code>{chat_id}</code> не заблокирован или не найден."
  banned_access: "⛔ Доступ к боту запрещён."
  sheet:
    attached: |
      ✅ <b>Расписание обновлено</b>
      • <b>Группа:</b> <code>{group_name}</code>
      • <b>ID таблицы:</b> <code>{sheet_id}</code>
      • <b>Кэш:</b> обновлен
      Старые ссылки группы удалены.
    approved: |
      ✅ <b>Ссылка одобрена и прикреплена</b>
      • <b>ID таблицы:</b> <code>{sheet_id}</code>
      • <b>Кэш:</b> обновлен
    rejected: |
      ❌ <b>Ссылка отклонена</b>
      • <b>ID таблицы:</b> <code>{sheet_id}</code>
    invalid: "❌ Некорректная ссылка или ID Google Sheets."
    detached: "🗑️ Ссылка на расписание удалена для группы <code>{group_name}</code>."
    not_attached: "ℹ️ Для группы <code>{group_name}</code> ссылка не была прикреплена."
    errors:
      group_not_found: "❌ Группа <code>{group_name}</code> не найдена."
      submission_not_found: "❌ Заявка на прикрепление ссылки не найдена."
  forwards:
    link:
      new_submission: |
        📌 <b>Новая ссылка на расписание</b>

        • Отправитель: {user_name} (@{user_username}, ID: {user_chat_id})
        • Группа: {group_name}
        • Sheet ID: {sheet_id}
        • Ссылка: {link_text}
      approve_button: ✅ Прикрепить ссылку к группе {group_name}
      reject_button: ❌ Отклонить ссылку для группы {group_name}
      approve_sheet: |
        ✅ <b>Ссылка на расписание одобрена!</b>

        • Группа: {group_name}
        • Sheet ID: {sheet_id}
    error:
      error_occurred: |
        ⚠️⚠️⚠️ Произошла ошибка: {error_message}